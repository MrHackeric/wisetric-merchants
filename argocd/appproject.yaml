apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wisetric-merchants
  namespace: argocd
  labels:
    app.kubernetes.io/name: wisetric-merchants
spec:
  description: ArgoCD Project for Wisetric Merchants web application
  sourceRepos:
    - "https://github.com/MrHackeric/wisetric-merchants"
    - "https://github.com/MrHackeric/wisetric-merchants.git"
    - "git@github.com:MrHackeric/wisetric-merchants.git"
  destinations:
    - namespace: "wisetric-merchants"
      server: "https://kubernetes.default.svc"
    - namespace: "default"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
