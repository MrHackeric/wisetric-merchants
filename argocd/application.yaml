apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wisetric-merchants
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: wisetric-merchants
spec:
  project: default
  source:
    repoURL: https://github.com/MrHackeric/wisetric-merchants.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: wisetric-merchants
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
