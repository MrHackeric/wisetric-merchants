apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wisetric-merchants-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: wisetric-merchants-server
    environment: production
spec:
  project: default
  source:
    repoURL: https://github.com/MrHackeric/wisetric-merchants.git
    targetRevision: main
    path: k8s/overlays/server
  destination:
    server: https://kubernetes.default.svc
    namespace: wisetric-merchants
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
