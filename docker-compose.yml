services:
  wisetric-merchants:
    build:
      context: .
      dockerfile: Dockerfile
    image: wisetric-merchants:latest
    container_name: wisetric-merchants-web
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
