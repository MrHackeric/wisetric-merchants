apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisetric-merchants-ingress
  namespace: wisetric-merchants
  labels:
    app: wisetric-merchants
    app.kubernetes.io/name: wisetric-merchants
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisetric-merchants
                port:
                  number: 80
