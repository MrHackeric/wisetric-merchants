apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisetric-merchants
  namespace: wisetric-merchants
  labels:
    app: wisetric-merchants
    app.kubernetes.io/name: wisetric-merchants
    app.kubernetes.io/instance: wisetric-merchants
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: wisetric-merchants
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wisetric-merchants
        app.kubernetes.io/name: wisetric-merchants
    spec:
      containers:
        - name: wisetric-merchants
          image: mrhackeric/wisetric-merchants:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
