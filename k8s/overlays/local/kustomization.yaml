apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wisetric-merchants

resources:
  - ../../base

# Replicas patch for local lightweight environment
replicas:
  - name: wisetric-merchants
    count: 1

# NodePort service patch for easy local browser access on http://localhost:30080
patches:
  - path: service-patch.yaml
