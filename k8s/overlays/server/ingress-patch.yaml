apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisetric-merchants-ingress
  namespace: wisetric-merchants
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - wisetric.example.com
      secretName: wisetric-merchants-tls
  rules:
    - host: wisetric.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisetric-merchants
                port:
                  number: 80
