apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wisetric-merchants

resources:
  - ../../base
  - hpa.yaml

# Replicas baseline for production server
replicas:
  - name: wisetric-merchants
    count: 2

# Ingress patch for production domain and TLS certificate
patches:
  - path: ingress-patch.yaml
